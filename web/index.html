<!doctype html>

<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <title>Realtime Caption</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        background: transparent;

        overflow: hidden;
      }

      #caption {
        position: absolute;

        left: 50%;
        bottom: 8%;

        transform: translateX(-50%);

        width: 90%;

        text-align: center;

        font-family: "Noto Sans KR", "Noto Sans JP", Arial, sans-serif;

        font-size: 42px;

        font-weight: 700;

        color: white;

        text-shadow:
          0 2px 4px black,
          0 0 8px black;

        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <div id="caption"></div>

    <script>
      const caption = document.getElementById("caption");

      const socket = new WebSocket("ws://localhost:8765");

      socket.onopen = () => {
        console.log("WebSocket connected");
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);

        caption.textContent = data.text || "";
      };

      socket.onclose = () => {
        console.log("WebSocket disconnected");
      };
    </script>
  </body>
</html>
